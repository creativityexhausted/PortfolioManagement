spring.application.name=fundamentals-service
server.port=${FUNDAMENTALS_SERVICE_PORT:8081}

# Reuses the same Finnhub account as the main portfolio-manager backend.
# This microservice only needs the /stock/metric (fundamentals) endpoint, never quotes/candles.
finnhub.api.base-url=${FINNHUB_BASE_URL:https://finnhub.io/api/v1}
finnhub.api.key=${FINNHUB_API_KEY:}

# How long a symbol's fundamentals score stays cached in memory before being re-fetched.
# Fundamentals (P/E, debt/equity, earnings growth) only change on quarterly earnings releases,
# so a 24h TTL is intentionally much longer than the main app's 5-minute live-price refresh.
snowflake.cache.ttl-ms=${SNOWFLAKE_CACHE_TTL_MS:86400000}

# Comma-separated list of allowed frontend origins (Vite dev server by default).
snowflake.cors.allowed-origins=${SNOWFLAKE_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}

server.error.include-message=always

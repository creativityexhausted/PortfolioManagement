spring.application.name=portfolio-manager

# Database configuration loaded from environment or .env file
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/${DB_NAME:pm}}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Naveen@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Use a Base64-encoded secret of at least 32 bytes in production.
app.jwt.secret=${JWT_SECRET:cG9ydGZvbGlvLW1hbmFnZXItZGV2LXNlY3JldC1rZXktMzItYnl0ZXMtbWluaW11bQ==}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

news.api.base-url=https://www.alphavantage.co
news.api.key=${NEWS_API_KEY:}

# Alpha Vantage is also used for ETF / Mutual Fund / equity symbol search when adding holdings.
# Reuses the news API key by default since both are Alpha Vantage; override with ALPHA_VANTAGE_API_KEY if using a separate key.
alphavantage.api.base-url=${ALPHA_VANTAGE_BASE_URL:https://www.alphavantage.co}
alphavantage.api.key=${ALPHA_VANTAGE_API_KEY:${NEWS_API_KEY:}}
news.api.query=${NEWS_API_QUERY:financial_markets}

market-data.schedule.initial-delay-ms=${MARKET_DATA_INITIAL_DELAY_MS:60000}
market-data.schedule.fixed-delay-ms=${MARKET_DATA_FIXED_DELAY_MS:300000}
finnhub.api.base-url=${FINNHUB_BASE_URL:https://finnhub.io/api/v1}
finnhub.api.key=${FINNHUB_API_KEY:}
news.schedule.initial-delay-ms=${NEWS_INITIAL_DELAY_MS:60000}
news.schedule.fixed-delay-ms=${NEWS_FIXED_DELAY_MS:900000}

chatbot.groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
chatbot.groq.api-key=${GROQ_API_KEY:}
chatbot.groq.model=${GROQ_MODEL:llama-3.1-8b-instant}
chatbot.groq.news-model=${GROQ_NEWS_MODEL:llama-3.3-70b-versatile}
chatbot.groq.temperature=${GROQ_TEMPERATURE:0.2}
chatbot.max-holdings-in-context=${CHATBOT_MAX_HOLDINGS_IN_CONTEXT:30}

server.error.include-message=always
